name: Phase376 Advance

on:
  push:
    branches: [novel-distill-v1]
    paths:
      - 'tools/phase375_to_376.py'
      - '.github/workflows/phase376_advance.yml'

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch authoritative state
        run: python tools/phase375_to_376.py
      - name: Commit Phase376 state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/project_state.json state/continuity/LATEST_CHECKPOINT.json
          git diff --cached --quiet || git commit -m 'phase376: advance to fresh passive-validator replication'
          git push
