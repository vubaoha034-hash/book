name: Phase372 Materialize

on:
  push:
    branches: [novel-distill-v1]
    paths:
      - 'tools/phase372_materialize.py'
      - '.github/workflows/phase372_materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize and validate Phase372 outputs
        run: python tools/phase372_materialize.py
      - name: Commit generated Phase372 outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/calibration/PHASE372_BOOK01_READER_EXPERIENCE_CARDS_V1.jsonl \
                  state/calibration/PHASE372_BOOK02_READER_EXPERIENCE_CARDS_V1.jsonl \
                  state/calibration/PHASE372_BOOK03_READER_EXPERIENCE_CARDS_V1.jsonl \
                  state/calibration/PHASE372_THREE_BOOK_READER_EXPERIENCE_SYNTHESIS_V1.md \
                  state/review_receipts/PHASE372_THREE_BOOK_SOURCE_ANCHORED_READER_EXPERIENCE_REDISTILLATION_V1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase372: materialize reader-experience outputs"
          git push origin HEAD:novel-distill-v1
