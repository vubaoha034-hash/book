name: Phase380 State Cleanup

on:
  push:
    branches: [novel-distill-v1]
    paths:
      - 'tools/phase380_state_cleanup.py'

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: novel-distill-v1
      - name: Clean stale continuity entries
        run: python tools/phase380_state_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "vubaoha034-hash"
          git config user.email "vubaoha034@gmail.com"
          git add state/project_state.json state/continuity/LATEST_CHECKPOINT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase380: clean stale phase378 continuity entries"
          git push origin HEAD:novel-distill-v1
