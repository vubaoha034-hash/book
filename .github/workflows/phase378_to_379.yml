name: Phase378 to 379

on:
  push:
    branches: [novel-distill-v1]
    paths:
      - 'tools/phase378_to_379.py'

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: novel-distill-v1
      - name: Patch authoritative state
        run: python tools/phase378_to_379.py
      - name: Commit phase379 state
        run: |
          git config user.name "vubaoha034-hash"
          git config user.email "vubaoha034@gmail.com"
          git add state/project_state.json state/continuity/LATEST_CHECKPOINT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase379: settle phase378 and activate diagnosis"
          git push origin HEAD:novel-distill-v1
