name: Phase375 Settle Pending Human

on:
  push:
    branches: [novel-distill-v1]
    paths:
      - 'tools/phase375_settle_pending.py'
      - '.github/workflows/phase375_settle_pending.yml'

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch authoritative state
        run: python tools/phase375_settle_pending.py
      - name: Commit Phase375 pending-human state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/project_state.json state/continuity/LATEST_CHECKPOINT.json
          git diff --cached --quiet || git commit -m 'phase375: await actual-human blind comparison'
          git push
