name: Validate Novel Skill

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate skill structure
        run: python scripts/validate_skill.py

      - name: Verify current mainline and feedback scope
        run: python scripts/verify_current_state.py

      - name: Test mainline continuity checks
        run: python -m unittest discover -s tests -p 'test_*.py'
